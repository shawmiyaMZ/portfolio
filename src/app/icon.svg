<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f3"/>
      <stop offset="0.52" stop-color="#f6f3ee"/>
      <stop offset="1" stop-color="#efe9e1"/>
    </linearGradient>
  </defs>
  <!-- Chip: the porcelain surface, an upper-left key light, no glass, no ring. -->
  <rect x="2" y="2" width="60" height="60" rx="21" fill="url(#chip)"/>
  <!-- Interior lip catching the key light. -->
  <rect x="1" y="1" width="58" height="28" rx="21" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.2"/>
  <!-- Contact shadow. -->
  <rect x="2" y="4" width="60" height="60" rx="21" fill="none" stroke="#3c2d23" stroke-opacity="0.10" stroke-width="1"/>
  <!-- SZ mark, a soft display serif, optically centred. -->
  <text x="32" y="35.5" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="600" letter-spacing="0.3" fill="#1a1917">SZ</text>
</svg>